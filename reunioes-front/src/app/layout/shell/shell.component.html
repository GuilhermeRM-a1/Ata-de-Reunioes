<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/reunioes">
      <i class="fas fa-clipboard-list me-2 text-primary"></i>Ata de Reunião
    </a>

    <button
      class="navbar-toggler"
      type="button"
      aria-label="Abrir menu"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAberto()">
      <div class="navbar-nav me-auto">
        <a class="nav-link" routerLink="/reunioes" routerLinkActive="active" (click)="fecharMenu()">
          <i class="fas fa-calendar-days me-2"></i>Reuniões
        </a>

        <a class="nav-link" routerLink="/acoes" routerLinkActive="active" (click)="fecharMenu()">
          <i class="fas fa-list-check me-2"></i>Ações
        </a>

        @if (auth.isAdmin) {
          <a class="nav-link" routerLink="/colaboradores" routerLinkActive="active" (click)="fecharMenu()">
            <i class="fas fa-users me-2"></i>Colaboradores
          </a>
        }
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2 py-2 py-lg-0">
        @if (auth.papel) {
          <span class="badge rounded-pill bg-secondary">
            {{ auth.papel }}
          </span>
        }

        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="sair()">
          <i class="fas fa-right-from-bracket me-1"></i>Sair
        </button>
      </div>
    </div>
  </div>
</nav>

<main class="container-xl px-3 py-4">
  <router-outlet></router-outlet>
</main>
