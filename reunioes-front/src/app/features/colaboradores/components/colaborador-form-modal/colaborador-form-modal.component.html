<div class="modal-header border-0">
  <h5 class="modal-title">
    {{ edicaoId === null ? 'Novo colaborador' : 'Editar colaborador' }}
  </h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Fechar"
    (click)="cancelar()"
  ></button>
</div>

<form (ngSubmit)="salvar()">
  <div class="modal-body">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <mdb-form-control>
          <input
            mdbInput
            type="text"
            id="nome"
            name="nome"
            class="form-control"
            [(ngModel)]="inputNome"
            required
          />
          <label mdbLabel class="form-label" for="nome">Nome</label>
        </mdb-form-control>
      </div>

      <div class="col-12 col-md-6">
        <mdb-form-control>
          <input
            mdbInput
            type="email"
            id="email"
            name="email"
            class="form-control"
            [(ngModel)]="inputEmail"
            required
          />
          <label mdbLabel class="form-label" for="email">E-mail</label>
        </mdb-form-control>
      </div>

      @if (edicaoId === null) {
        <div class="col-12 col-md-6">
          <mdb-form-control>
            <input
              mdbInput
              type="password"
              id="senha"
              name="senha"
              class="form-control"
              [(ngModel)]="inputSenha"
              required
            />
            <label mdbLabel class="form-label" for="senha">Senha</label>
          </mdb-form-control>
        </div>
      }

      <div class="col-12 col-md-6">
        <label for="papel" class="form-label">Papel</label>
        <select
          id="papel"
          name="papel"
          class="form-select"
          [(ngModel)]="inputPapel"
          required
        >
          @for (papel of papeis; track papel) {
            <option [value]="papel">{{ rotuloPapel(papel) }}</option>
          }
        </select>
      </div>

      <div class="col-12">
        <div class="form-check mb-0">
          <input
            type="checkbox"
            id="monitorar"
            name="monitorar"
            class="form-check-input"
            [(ngModel)]="inputMonitorarReunioes"
          />
          <label class="form-check-label" for="monitorar">
            Monitorar reuniões
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer border-0">
    <button type="button" class="btn btn-outline-secondary" mdbRipple (click)="cancelar()">
      Cancelar
    </button>

    <button type="submit" class="btn btn-primary" mdbRipple>
      <i class="fas fa-floppy-disk me-1"></i>
      {{ edicaoId === null ? 'Cadastrar' : 'Salvar alterações' }}
    </button>
  </div>
</form>
