services:
  postgres:
    image: postgres:17
    container_name: reunioes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reunioes_dev
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d reunioes_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../..
      dockerfile: ../../../Dockerfile
    container_name: reunioes_api
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_URL: jdbc:postgresql://postgres:5432/reunioes_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
