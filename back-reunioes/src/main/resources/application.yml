spring:
  application:
    name: reunioes

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reunioes_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    # validate: o Hibernate so confere se as entidades batem com o banco.
    # Quem cria tabela e o Flyway, nunca o Hibernate.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# Swagger UI em /swagger-ui.html — e por onde a API e testada sem Postman.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
