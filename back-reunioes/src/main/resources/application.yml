spring:
  # Sem profiles.default de proposito: esquecer de definir o perfil em producao
  # nao pode carregar a seed fake de dev. O perfil e escolhido por fora
  # (SPRING_PROFILES_ACTIVE no ambiente ou spring.profiles.active no .env).
  config:
    import: optional:file:.env[.properties]
  application:
    name: reunioes

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # validate: o Hibernate so confere se as entidades batem com o banco.
    # Quem cria tabela e o Flyway, nunca o Hibernate.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Base: so schema. Cada perfil acrescenta a sua pasta de seed.
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
          brasilApiFeriados:
            connectTimeout: 3000
            readTimeout: 5000

server:
  port: 8080

# Swagger UI em /swagger-ui.html — e por onde a API e testada sem Postman.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# Configuracoes de log
logging:
  level:
    br.com.empresa.reunioes: DEBUG

api:
  security:
    token:
      secret: ${JWT_SECRET}
      issuer: reunioes-api
  # API externa de feriados nacionais, consumida por Feign.
  feriados:
    url: https://brasilapi.com.br/api/feriados/v1

app:
  cors:
    allowed-origins: http://localhost:4200