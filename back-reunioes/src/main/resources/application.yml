spring:
  application:
    name: reunioes

  datasource:
    url: jdbc:h2:mem:reunioes
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true

server:
  port: 8080

# Swagger UI em /swagger-ui.html — e por onde a API e testada sem Postman.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs